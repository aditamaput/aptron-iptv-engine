name: APTRON Engine CI

on:
  push:
    branches:
      - "**"
    paths:
      - "generator.py"
      - "aptron/**"
      - "tests/**"
      - "sources/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "generator.py"
      - "aptron/**"
      - "tests/**"
      - "sources/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: aptron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q generator.py aptron tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
